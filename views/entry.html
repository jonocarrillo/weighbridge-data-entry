<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weighbridge — Entry</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">⚖️ Weigh-in</h1>
    <nav><a href="/">← Dashboard</a></nav>
  </header>

  <main>
    <!-- Details (weigh-in only) -->
    <div class="card" id="detailsCard">
      <h2>Vehicle &amp; load details</h2>
      <div class="grid">
        <div class="field"><label>Vehicle / rego</label><input id="vehicle_rego"></div>
        <div class="field"><label>Driver name</label><input id="driver_name"></div>
        <div class="field"><label>Haulier / company</label><input id="haulier"></div>
        <div class="field"><label>Product / material</label><input id="product"></div>
        <div class="field"><label>Customer</label><input id="customer"></div>
        <div class="field"><label>Supplier</label><input id="supplier"></div>
        <div class="field full"><label>Destination</label><input id="destination"></div>
      </div>
    </div>

    <!-- Weight -->
    <div class="card">
      <h2 id="weightHeading">Weigh-in reading</h2>
      <div class="grid">
        <div class="field">
          <label id="firstLabel">First weight (kg)</label>
          <input id="first_weight" type="number" step="0.01" inputmode="decimal">
        </div>
        <div class="field" id="secondField" style="display:none">
          <label>Second weight (kg)</label>
          <input id="second_weight" type="number" step="0.01" inputmode="decimal">
        </div>
        <div class="field" id="netField" style="display:none">
          <label>Net weight (kg)</label>
          <input id="net_preview" disabled>
        </div>
      </div>
      <div class="field full" style="margin-top:14px">
        <label>Notes</label>
        <textarea id="notes"></textarea>
      </div>
    </div>

    <!-- Signature (weigh-out only) -->
    <div class="card" id="sigCard" style="display:none">
      <h2>Signature</h2>
      <div class="sigwrap">
        <canvas id="sigpad" class="sigpad" width="440" height="150"></canvas>
      </div>
      <p class="hint">Sign above to confirm the weigh-out.
        <button class="btn small secondary" id="clearSig" type="button">Clear</button>
      </p>
    </div>

    <div class="actions-bar">
      <button class="btn green" id="saveBtn">Save weigh-in</button>
      <a class="btn secondary" href="/">Cancel</a>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (s) => document.querySelector(s);
    const params = new URLSearchParams(location.search);
    const outId = params.get('out');          // present => weigh-out mode
    const mode = outId ? 'out' : 'in';

    function toast(msg, err = false) {
      const t = $('#toast');
      t.textContent = msg;
      t.className = 'toast show' + (err ? ' err' : '');
      setTimeout(() => t.className = 'toast', 2400);
    }

    // ---------- Signature pad ----------
    const canvas = $('#sigpad');
    const ctx = canvas.getContext('2d');
    ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#111';
    let drawing = false, hasSig = false;
    function pos(e) {
      const r = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - r.left, y: p.clientY - r.top };
    }
    function start(e) { drawing = true; hasSig = true; const {x,y} = pos(e); ctx.beginPath(); ctx.moveTo(x,y); e.preventDefault(); }
    function move(e)  { if (!drawing) return; const {x,y} = pos(e); ctx.lineTo(x,y); ctx.stroke(); e.preventDefault(); }
    function end()    { drawing = false; }
    canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move);
    window.addEventListener('touchend', end);
    $('#clearSig').onclick = () => { ctx.clearRect(0,0,canvas.width,canvas.height); hasSig = false; };

    // ---------- Weigh-out setup ----------
    let openRow = null;
    async function initOut() {
      $('#title').textContent = '⚖️ Weigh-out';
      $('#weightHeading').textContent = 'Weigh-out reading';
      $('#firstLabel').textContent = 'First weight (kg) — recorded';
      $('#first_weight').disabled = true;
      $('#detailsCard').style.display = 'none';
      $('#secondField').style.display = '';
      $('#netField').style.display = '';
      $('#sigCard').style.display = '';
      $('#saveBtn').textContent = 'Save weigh-out';

      const res = await fetch('/api/entries/' + outId);
      if (!res.ok) { toast('Entry not found', true); return; }
      openRow = await res.json();
      $('#first_weight').value = openRow.first_weight ?? '';
      $('#notes').value = openRow.notes ?? '';
      // show a details summary above weight
      const esc = (v) => v == null ? '' :
        String(v).replace(/[&<>"']/g, c =>
          ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<h2>${esc(openRow.ticket_no)} — ${esc(openRow.vehicle_rego) || 'vehicle'}</h2>
        <p class="muted">${[openRow.driver_name, openRow.product, openRow.customer].filter(Boolean).map(esc).join(' · ') || 'No details'}</p>`;
      $('main').insertBefore(d, $('main').firstChild);

      $('#second_weight').addEventListener('input', updateNet);
    }
    function updateNet() {
      const first = Number(openRow.first_weight || 0);
      const second = Number($('#second_weight').value || 0);
      $('#net_preview').value = $('#second_weight').value === '' ? '' :
        Math.abs(first - second).toLocaleString() + ' kg';
    }

    // ---------- Save ----------
    async function save() {
      if (mode === 'in') {
        if ($('#first_weight').value === '') return toast('First weight is required', true);
        const body = {
          vehicle_rego: $('#vehicle_rego').value, driver_name: $('#driver_name').value,
          haulier: $('#haulier').value, product: $('#product').value,
          customer: $('#customer').value, supplier: $('#supplier').value,
          destination: $('#destination').value, first_weight: $('#first_weight').value,
          notes: $('#notes').value
        };
        const res = await fetch('/api/entries', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
        });
        if (res.ok) { const r = await res.json(); toast('Weighed in — ' + r.ticket_no);
          setTimeout(() => location = '/', 900); }
        else toast('Save failed', true);
      } else {
        if ($('#second_weight').value === '') return toast('Second weight is required', true);
        if (!hasSig) return toast('Please capture a signature', true);
        const body = {
          second_weight: $('#second_weight').value,
          notes: $('#notes').value,
          signature: canvas.toDataURL('image/png')
        };
        const res = await fetch('/api/entries/' + outId + '/weighout', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
        });
        if (res.ok) { const r = await res.json(); toast('Weighed out — net ' + Number(r.net_weight).toLocaleString() + ' kg');
          setTimeout(() => location = '/ticket/' + outId, 900); }
        else toast('Save failed', true);
      }
    }
    $('#saveBtn').onclick = save;

    if (mode === 'out') initOut();
  </script>
</body>
</html>
